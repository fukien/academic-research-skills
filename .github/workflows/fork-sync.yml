name: Automatic Fork Sync

on:
  schedule:
    - cron: '0 0 * * *' # 00:00 UTC / 08:00 Singapore
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: automatic-fork-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync main with upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/${GH_REPO}/merge-upstream" \
            -f branch=main
